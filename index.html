ик обнаружено</p><div style="height:8px;background:#26333d;border-radius:9px;overflow:hidden"><div style="height:100%;width:${state.found.length/CLUES.length*100}%;background:var(--red)"></div></div><p>${state.read.length} из ${DOCS.length} документов прочитано · ${state.interviewed.length} из ${SUS.length} подозреваемых допрошено</p><button onclick="go('sus')">Открыть список подозреваемых</button></section></div>`,
map:()=>`<section class="panel"><h2>Интерактивная карта станции</h2><p class="muted">Нажмите на локацию, чтобы осмотреть её. Найденные материалы сохраняются в деле. Карта схематическая, не в масштабе.</p><div class="map"><button class="hotspot h1p" onclick="inspect('studio')"><i class="dot"></i> Студия A</button><button class="hotspot h2p" onclick="inspect('archive')"><i class="dot"></i> Архив</button><button class="hotspot h3p" onclick="inspect('control')"><i class="dot"></i> Аппаратная</button><button class="hotspot h4p" onclick="inspect('corridor')"><i class="dot"></i> Служебный коридор</button><button class="hotspot h5p" onclick="inspect('lobby')"><i class="dot"></i> Вестибюль</button><button class="hotspot h6p" onclick="inspect('guard')"><i class="dot"></i> Пост охраны</button><button class="hotspot h7p" onclick="inspect('small')"><i class="dot"></i> Малая студия</button><button class="hotspot h8p" onclick="inspect('rest')"><i class="dot"></i> Комната отдыха</button></div><div class="grid two" style="margin-top:12px"><div class="panel"><h3>Осмотренные локации</h3><div class="boarditems">${Object.keys(LOC).filter(k=>state.read.includes('loc_'+k)).map(k=>`<span class="pill">${LOC[k].name}</span>`).join('')||'<span class="muted">Пока нет</span>'}</div></div><div class="panel"><h3>Схема доступа</h3><p>Публичные двери записываются электронной системой. Старые помещения используют механические ключи. Не предполагайте, что журнал доступа подтверждает личность.</p><button onclick="openDoc('d3')">Изучить протокол осмотра</button></div></div></section>`,
clues:()=>`<section class="panel"><h2>Каталог улик</h2><p class="muted">Необнаруженные материалы скрыты. Некоторые становятся понятнее только в сравнении с документами.</p><div class="tabs"><button onclick="filterClues('all')">Все (${CLUES.length})</button><button onclick="filterClues('found')">Найденные (${state.found.length})</button><button onclick="filterClues('important')">Важные (${state.important.length})</button></div><div id="cluelist">${CLUES.map(c=>state.found.includes(c.id)?clueCard(c):`<div class="clue"><div class="num">?</div><div><strong>Материал не изучен</strong><div class="muted">Исследуйте локации, чтобы открыть новую улику.</div></div></div>`).join('')}</div></section>`,
docs:()=>`<div class="grid two">${DOCS.map(d=>`<button class="panel" style="text-align:left" onclick="openDoc('${d[0]}')"><div class="eyebrow">${d[2]}</div><h3>${d[1]}</h3><div class="muted">${state.read.includes(d[0])?'Прочитан':'Открыть документ'}</div></button>`).join('')}</div>`,
sus:()=>`<section class="panel"><h2>Подозреваемые и свидетели</h2><p class="muted">У каждого есть причина что-то скрывать. Это не означает, что каждый связан с убийством.</p><div class="grid two">${SUS.map(s=>`<button class="suspect" onclick="openSus('${s.id}')"><img src="${portrait(s.p)}" alt="Портрет ${esc(s.name)}"><span><strong>${esc(s.name)}</strong><small>${esc(s.age+' лет · '+s.role)}</small><small style="display:block;margin-top:5px">${state.interviewed.includes(s.id)?'Допрос проведён':'Допрос не проведён'}</small></span></button>`).join('')}</div></section>`,
interview:()=>`<section class="panel"><h2>Комната допросов</h2><p>Выберите персонажа. Новые вопросы появляются по мере обнаружения материалов. Предъявление улики не гарантирует признания.</p><div class="grid two">${SUS.map(s=>`<button onclick="openInterview('${s.id}')">${esc(s.name)} ${state.interviewed.includes(s.id)?'✓':''}</button>`).join('')}</div><div class="notice">Тактика влияет на тон ответов, но не меняет факты дела.</div></section>`,
digital:()=>`<div class="grid two"><section class="panel"><h2>Цифровой архив</h2><p class="muted">Доступ к материалам открывается при осмотре соответствующих мест.</p>${[['c4','Резервная запись эфира'],['c8','Расшифровка звонков'],['c11','Отчёт о питании']].map(([id,t])=>`<div class="clue"><div class="num">▣</div><div><strong>${t}</strong><p>${state.found.includes(id)?'Доступ разрешён':'Доступ ограничен'}</p>${state.found.includes(id)?`<button onclick="openClue('${id}')">Открыть</button>`:''}</div></div>`).join('')}</section><section class="panel"><h2>Внутренний чат расследования</h2><div class="chat" id="chat">${state.messages.map(m=>`<div class="bubble ${m.me?'me':''}">${esc(m.text)}</div>`).join('')||'<div class="muted">Пока сообщений нет. Оставьте себе рабочую заметку или гипотезу.</div>'}</div><form onsubmit="sendChat(event)" class="row" style="margin-top:10px"><input id="chatinput" placeholder="Сообщение для своей рабочей ленты"><button class="primary">Отправить</button></form><p class="muted">Это локальный журнал на этом устройстве, не онлайн-чат.</p></section></div>`,
timeline:()=>`<section class="panel"><h2>Временная шкала</h2><p>Добавляйте события из материалов дела. Сопоставляйте серверное время, часы на фото и показания.</p><form class="grid two" onsubmit="addTime(event)"><input id="ttime" placeholder="Время, например 23:27" required><input id="tevent" placeholder="Событие / источник" required><button class="primary">Добавить событие</button></form><div style="margin-top:12px">${state.timeline.slice().sort((a,b)=>a.time.localeCompare(b.time)).map((t,i)=>`<div class="clue"><div class="num">${esc(t.time)}</div><div style="flex:1">${esc(t.event)}</div><button onclick="removeTime(${i})">Удалить</button></div>`).join('')||'<p class="muted">Временная шкала пока пуста.</p>'}</div></section>`,
board:()=>`<section class="panel"><h2>Доска расследования</h2><p>Добавляйте найденные улики и собственные версии, затем создавайте связи. Связь на доске — ваша гипотеза, а не автоматическое подтверждение.</p><div class="row"><select id="bitem">${CLUES.filter(c=>state.found.includes(c.id)).map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')||'<option value="">Сначала найдите улику</option>'}</select><button onclick="addBoard()">Добавить улику</button></div><div class="row" style="margin-top:8px"><input id="bnote" placeholder="Своя версия или наблюдение"><button onclick="addBoardNote()">Добавить заметку</button></div><div class="boarditems" style="margin-top:12px">${state.board.map((b,i)=>`<div class="boarditem"><strong>${esc(b.title)}</strong><p>${esc(b.text||'Материал '+b.id)}</p><button onclick="linkBoard(${i})">Связать с…</button> <button onclick="removeBoard(${i})">Удалить</button></div>`).join('')||'<p class="muted">Доска пуста. Добавьте найденные улики и свои заметки.</p>'}</div><div class="notice">Связи: ${state.links.map(l=>`${esc(state.board[l[0]]?.title||'?')} ↔ ${esc(state.board[l[1]]?.title||'?')}`).join(' · ')||'пока не созданы'}</div></section>`,
notes:()=>`<section class="panel"><h2>Заметки следователя</h2><p>Записывайте версии, вопросы и то, что ещё нужно проверить. Заметки сохраняются автоматически на этом устройстве.</p><textarea id="notes" placeholder="Моя версия…">${esc(state.notes)}</textarea><div class="row" style="margin-top:8px"><button class="primary" onclick="state.notes=document.getElementById('notes').value;persist();toast('Заметки сохранены')">Сохранить</button><button onclick="state.notes='';persist();render()">Очистить</button></div></section>`,
final:()=>`<section class="panel"><h2>Итоговый отчёт следователя</h2><p>Заполняйте, когда будете готовы. Ошибка не завершает расследование. Ваша версия сохраняется локально.</p><label>Кого вы обвиняете?</label><select id="vsus">${'<option value="">Выберите персонажа</option>'+SUS.map(s=>`<option value="${s.id}" ${state.verdict.sus===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select><label>Мотив</label><textarea id="vmotive" placeholder="Что могло стать причиной?">${esc(state.verdict.motive)}</textarea><label>Способ и возможность</label><textarea id="vmethod" placeholder="Как преступление было совершено и почему это физически возможно?">${esc(state.verdict.method)}</textarea><label>Последовательность событий</label><textarea id="vtimeline" placeholder="Восстановите ключевые события по времени">${esc(state.verdict.timeline)}</textarea><label>Главные доказательства</label><div class="grid two">${CLUES.filter(c=>state.found.includes(c.id)).map(c=>`<label class="pill"><input style="width:auto" type="checkbox" value="${c.id}" ${state.verdict.evidence.includes(c.id)?'checked':''}> ${esc(c.title)}</label>`).join('')||'<p class="muted">Сначала соберите улики.</p>'}</div><label>Объясните противоречия и невиновность остальных</label><textarea id="vother" placeholder="Какие факты опровергают альтернативные версии?">${esc(state.verdict.other)}</textarea><button class="primary" onclick="saveVerdict()">Сохранить версию</button><div id="score" class="notice">${state.verdict.sus?'Черновик обвинения сохранён. Вы можете менять его после новых улик.':'Не спешите: сначала сопоставьте факты.'}</div><p class="muted">В этой версии финальный этап не выдаёт автоматическое «правильно/неправильно»: это предотвращает ложную оценку по ключевым словам. Для подтверждения вывода используйте только факты, которые доступны в материалах.</p></section>`
};
const LOC={studio:{name:'Студия A',clues:['c1'],docs:['d1'],txt:'На пульте горит индикатор резервной записи. После завершения передачи канал ведущей остался открыт. Снимите показания пульта и сравните их с архивной записью.'},archive:{name:'Архив',clues:['c7','c10'],docs:['d3','d5'],txt:'В архивной комнате найдено тело редактора. Катушка №09 вынута из шкафа, рядом заметна нарушенная пыль. На обороте карточки оставлена записка.'},control:{name:'Аппаратная',clues:['c4','c11'],docs:['d4'],txt:'Резервный сервер хранит дорожку отдельно от эфирного сигнала. Журнал питания указывает на короткий сбой синхронизации, но запись не прервалась.'},corridor:{name:'Служебный коридор',clues:['c2','c9'],docs:['d3'],txt:'Коридор соединяет архив, малую студию и аппаратную. На публичной схеме он отсутствует. Волокно на ручке слишком распространено, чтобы само по себе указать на человека.'},lobby:{name:'Вестибюль',clues:['c12'],docs:['d1'],txt:'Вестибюльная камера показывает входящих, но не доказывает, что человек сразу покинул здание после заказа такси.'},guard:{name:'Пост охраны',clues:['c3'],docs:['d3'],txt:'Журнал доступа фиксирует использование карт и ключей, но карта могла быть передана другому сотруднику. Время сверяйте с независимыми источниками.'},small:{name:'Малая студия',clues:['c6'],docs:['d4'],txt:'В расписании есть исправление, внесённое до эфира, но уведомление было направлено только одному адресату. Это может объяснять тайную встречу, но не убийство.'},rest:{name:'Комната отдыха',clues:['c5','c8'],docs:['d2'],txt:'На фото телефона видны отражённые часы. Телефон жертвы содержит звонки с серверным рассогласованием времени. Сравните обе временные шкалы.'}};
function inspect(k){let l=LOC[k];if(!l)return;state.read.push('loc_'+k);l.clues.forEach(id=>{let c=CLUES.find(x=>x.id===id);if(c&&(!c.unlock.length||c.unlock.every(u=>state.found.includes(u))))if(!state.found.includes(id))state.found.push(id)});l.docs.forEach(id=>{if(!state.read.includes(id))state.read.push(id)});persist();modal(l.name,`<p>${esc(l.txt)}</p><h3>Материалы, обнаруженные здесь</h3>${l.clues.map(id=>{let c=CLUES.find(x=>x.id===id);return c?`<div class="clue"><div class="num">${id.toUpperCase()}</div><div><strong>${esc(c.title)}</strong><p>${esc(c.txt)}</p><button onclick="closeModal();openClue('${id}')">Изучить улику</button></div></div>`:''}).join('')}<p class="muted">Возвращайтесь сюда после новых допросов: некоторые материалы можно интерпретировать иначе, когда появится дополнительный контекст.</p>`);render()}
function openDoc(id){let d=DOCS.find(x=>x[0]===id);if(!d)return;state.read.includes(id)||state.read.push(id);let body=`<div class="doc"><b>РАДИОСТАНЦИЯ «МАЯК-9»</b>\n${esc(d[1])}\n${esc(d[2])}\n\n${esc(d[3])}\n\n— Конец документа —</div><p class="muted">Документ сохранён в прочитанных материалах. Сравните время и формулировки с показаниями.</p>`;persist();modal(d[1],body);render()}
function openSus(id){let s=SUS.find(x=>x.id===id);modal(s.name,`<div class="row" style="align-items:flex-start"><img src="${portrait(s.p)}" alt="${esc(s.name)}" style="width:120px;height:155px;object-fit:cover;object-position:center 20%;border-radius:8px"><div><div class="eyebrow">${s.age} ЛЕТ · ${esc(s.role)}</div><p>${esc(s.bio)}</p></div></div><h3>Мотив, который следует проверить</h3><p>${esc(s.motive)}</p><h3>Заявленное алиби</h3><p>${esc(s.alibi)}</p><button class="primary" onclick="closeModal();openInterview('${id}')">Начать допрос</button>`)}
function openInterview(id){let s=SUS.find(x=>x.id===id);state.interviewed.includes(id)||state.interviewed.push(id);let qs=[['Где вы были в критический период?',`«${s.alibi} Я понимаю, что этого недостаточно без независимого подтверждения».`],['Какие у вас были отношения с Невзоровым?',`«Он задавал вопросы, которые не всем нравились. Я не собираюсь делать вид, что мы были друзьями».`],['Что вы скрываете от следствия?',`«У каждого здесь есть причина не рассказывать всё сразу. Но скрытая деталь не равна убийству».`],['Что вы знаете о старой записи?',state.found.includes('c7')?'«Катушка №09 была закрыта не просто так. Проверьте каталог и дату замены».':'«Я слышал о ней, но без самой катушки не хочу строить догадки».'],['Предъявить найденную улику',state.found.length?'«Я вижу материал. Но вы должны объяснить, почему он относится ко мне».':'«Пока вы ничего мне не предъявили».']];modal('Допрос: '+s.name,`<div class="row" style="align-items:flex-start"><img src="${portrait(s.p)}" style="width:96px;height:125px;object-fit:cover;border-radius:8px" alt="Портрет"><div><strong>${esc(s.role)}</strong><p>${esc(s.bio)}</p><div class="pill">Тактика разговора</div><select id="tactic"><option>Нейтральная</option><option>Настойчивая</option><option>Конфронтационная</option></select></div></div><div id="dialogue" class="chat" style="margin-top:12px"><div class="bubble">«Я уже дал первоначальные показания. Что именно вы хотите уточнить?»</div></div><div class="grid two" style="margin-top:10px">${qs.map((q,i)=>`<button onclick="ask('${id}',${i})">${q[0]}</button>`).join('')}</div><p class="muted">Известные секреты не показываются автоматически. Ответы открывают контекст, но не подтверждают вину.</p>`);persist()}
function ask(id,i){const labels=["Где вы были в критический период?","Какие у вас были отношения с Невзоровым?","Что вы скрываете от следствия?","Что вы знаете о старой записи?","Предъявить найденную улику"];const replies=["У меня нет другого способа доказать это, кроме журнала и людей, которые меня видели.","Он собирался опубликовать кое-что обо мне. Да, я был зол, но это не доказывает, что я его убил.","Я не рассказал всё, потому что это касается моей репутации. Если вы покажете конкретный факт, я объясню его.",state.found.includes("c7")?"Катушка №09 могла быть заменена после исходного эфира. Сверьте её с журналом каталога и резервной дорожкой.":"Я не могу обсуждать закрытый архив без самой записи. Найдите оригинал и тогда задавайте вопрос.",state.found.length?"Вы предъявляете "+state.found.length+" найденных материалов. Сопоставьте их с точным временем и доступом к помещению, а не только с моим мотивом.":"Вы пока не предъявили найденных доказательств. Вернитесь с конкретным материалом."];const d=document.getElementById("dialogue");d.insertAdjacentHTML("beforeend",'<div class="bubble me">'+esc(labels[i])+'</div><div class="bubble">'+esc(replies[i])+'</div>');if(i===2)state.answers[id+"_secret"]=true;persist()}
function sendChat(e){e.preventDefault();let i=document.getElementById('chatinput');if(!i.value.trim())return;state.messages.push({me:true,text:i.value.trim()});persist();render()}
function addTime(e){e.preventDefault();state.timeline.push({time:document.getElementById('ttime').value.trim(),event:document.getElementById('tevent').value.trim()});persist();render()}function removeTime(i){state.timeline.splice(i,1);persist();render()}
function addBoard(){let id=document.getElementById('bitem').value;if(!id)return;let c=CLUES.find(x=>x.id===id);if(!state.board.some(b=>b.id===id))state.board.push({id,title:c.title,text:c.txt});persist();render()}function addBoardNote(){let t=document.getElementById('bnote').value.trim();if(!t)return;state.board.push({id:'note'+Date.now(),title:'Заметка следователя',text:t});persist();render()}function removeBoard(i){state.board.splice(i,1);state.links=state.links.filter(l=>l[0]!==i&&l[1]!==i).map(l=>l.map(x=>x>i?x-1:x));persist();render()}function linkBoard(i){if(state.board.length<2){toast('Добавьте ещё один элемент на доску');return}let opts=state.board.map((b,j)=>`${j}: ${b.title}`).filter((x,j)=>j!==i).join('\n');let ans=prompt('Введите номер элемента для связи:\n'+opts);let j=Number(ans);if(ans===null||!Number.isInteger(j)||j<0||j>=state.board.length||j===i){toast('Связь не создана');return}state.links.push([i,j]);persist();render();toast('Гипотетическая связь сохранена')}
function saveVerdict(){state.verdict={sus:document.getElementById('vsus').value,motive:document.getElementById('vmotive').value,method:document.getElementById('vmethod').value,timeline:document.getElementById('vtimeline').value,evidence:[...document.querySelectorAll('#view input[type=checkbox]:checked')].map(x=>x.value),other:document.getElementById('vother').value};persist();document.getElementById('score').textContent='Черновик сохранён. Проверьте, что каждый вывод подкреплён конкретным материалом и что альтернативные версии объяснены.';toast('Отчёт сохранён')}
function filterClues(which){let arr=CLUES.filter(c=>which==='all'||(which==='found'&&state.found.includes(c.id))||(which==='important'&&state.important.includes(c.id)));document.getElementById('cluelist').innerHTML=arr.map(c=>state.found.includes(c.id)?clueCard(c):`<div class="clue"><div class="num">?</div><div><strong>Материал не изучен</strong><p>Исследуйте локации, чтобы открыть его.</p></div></div>`).join('')}
document.getElementById('saveBtn').onclick=save;document.getElementById('resetBtn').onclick=()=>{if(confirm('Сбросить весь прогресс расследования на этом устройстве?')){localStorage.removeItem(KEY);state={page:'home',found:[],read:[],interviewed:[],answers:{},notes:'',clueNotes:{},important:[],board:[],links:[],timeline:[],messages:[],verdict:{sus:'',motive:'',method:'',timeline:'',evidence:[],other:''},hint:0};render();toast('Новое расследование начато')}};document.getElementById('view').addEventListener('input',e=>{if(e.target.id==='notes'){state.notes=e.target.value;persist()}});load();render();
</script><div id="modal" class="hidden" style="position:fixed;z-index:50;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto"></div><div id="toast" class="hidden" style="position:fixed;z-index:70;bottom:100px;left:50%;transform:translateX(-50%);background:#26343f;border:1px solid #53616a;padding:10px 16px;border-radius:10px;max-width:90vw"></div></body></html>
